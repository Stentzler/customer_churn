name: CI

on:
  pull_request:
  push:
    paths:
      - ".github/workflows/ci.yml"
      - "src/**"
      - "tests/**"
      - "config/ruff.toml"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install locked dependencies
        run: make install

      - name: Run lint checks
        run: make lint

      - name: Run tests
        run: make test
