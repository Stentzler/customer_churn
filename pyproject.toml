[project]
name = "customer-churn-agentic-mlops"
version = "0.1.0"
description = "Auditable DataOps, MLOps, and constrained LLMOps lifecycle for synthetic customer churn."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "evidently>=0.7,<0.8",
    "joblib>=1.4,<2",
    "mlflow>=3.5,<4",
    "pandas>=2.2,<3",
    "pandera[pandas]>=0.24,<1",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6,<7",
    "scikit-learn>=1.6,<2",
]

[dependency-groups]
dev = [
    "dvc>=3,<4",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
extend = "./config/ruff.toml"
